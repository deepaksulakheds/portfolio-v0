<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting...</title>
    <script type="text/javascript">
      (function () {
        var path = window.location.pathname;
        var base = "/portfolio-v0";

        // If URL doesn't start with base, redirect to base root
        if (!path.startsWith(base)) {
          window.location.href = base + "/";
          return;
        }

        // Extract the path after the base
        var relativePath = path.slice(base.length);

        // Redirect to index.html with the full relative path preserved
        window.location.href =
          base +
          "/index.html" +
          relativePath +
          window.location.search +
          window.location.hash;
      })();
    </script>
  </head>
  <body></body>
</html>
