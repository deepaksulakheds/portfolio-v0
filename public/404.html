<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting...</title>
    <script type="text/javascript">
      // Redirect all 404s back to index.html preserving the path
      const base = "/portfolio-v0";
      const path = window.location.pathname;

      if (!path.startsWith(base)) {
        // If path is outside base, redirect to base root
        window.location.href = base + "/";
      } else {
        // Redirect to index.html and preserve the path in a query param or hash
        window.location.href =
          base + "/index.html" + window.location.search + window.location.hash;
      }
    </script>
  </head>
  <body></body>
</html>
